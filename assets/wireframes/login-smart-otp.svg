  <rect x="28" y="368" width="48" height="48" fill="#fff" stroke="#333"/>
  <rect x="84" y="368" width="48" height="48" fill="#fff" stroke="#333"/>
  <rect x="140" y="368" width="48" height="48" fill="#fff" stroke="#333"/>
  <rect x="196" y="368" width="48" height="48" fill="#fff" stroke="#333"/>
  <rect x="252" y="368" width="48" height="48" fill="#fff" stroke="#333"/>
